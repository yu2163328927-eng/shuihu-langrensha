<body>
<section id="start" class="screen">

    <div class="seal">密</div>
    <div class="subtitle">七夜查奸 · 一念定生死</div>
    <h1>水浒传·梁山卧底</h1>
    <p class="start-copy">你受晁盖密命，成为梁山“掌案头领”。官军七日后压境，寨中至少一人正在传递情报。你必须在兄弟义气、伪造证据与官府阴谋之间，找到真正的暗桩。</p>
    <div class="name-row"><input id="playerName" maxlength="8" placeholder="输入你的掌案名号（可留空）"><button class="btn ghost" id="randomNameBtn">随机名号</button></div>
    <div class="mode-grid" id="modeGrid">
      <div class="mode-card active" data-mode="classic"><b>经典模式</b><span>原著核心好汉不会主动投敌，但可能被胁迫、冒名或利用。适合第一次游玩。</span></div>
      <div class="mode-card" data-mode="wujian"><b>无间模式</b><span>所有人都可能是真正的官府暗桩。身份更混乱，结局更残酷。</span></div>
      <div class="mode-card" data-mode="hard"><b>铁案模式</b><span>每关行动点更少，不自动标记证据矛盾，官军警戒增长更快。</span></div>
    </div>
    <div class="start-actions"><button class="btn" id="newGameBtn">接下密令</button><button class="btn gold" id="wolfBtn">狼人杀·聚义厅</button><button class="btn gold" id="continueBtn">继续旧案</button><button class="btn ghost" id="rulesBtn">查看玩法</button><button class="btn ghost" id="saveManagerBtn">存档管理</button><button class="btn ghost" id="endingsBtn">结局图鉴</button></div><p class="save-hint" id="saveHint"></p><p class="save-hint" id="endingsHint"></p>
  </div>
</section>
<section id="intro" class="screen hidden">
  <div class="intro-card paper">
    <div class="intro-scene"><div class="rain"></div><div class="window"></div><div class="figure chao"></div><div class="figure player"></div><div class="table-sil"></div><div class="token"></div></div>
    <div class="intro-text" id="introText"></div>
    <div class="intro-actions"><button class="btn" id="enterGameBtn">收下令牌</button></div>
  </div>
</section>
<section id="game" class="screen hidden">
  <header class="topbar">
    <div class="brand">梁山密案 · <span id="playerTitle"></span></div>

    <div class="resource supplies"><div class="resource-head"><span>粮草</span><b id="suppliesText">0</b></div><div class="meter"><i id="suppliesBar"></i></div></div>

    <button class="top-icon" id="settingsBtn" title="设置">设</button><button class="top-icon" id="saveBtn" title="存档管理">档</button>
  </header>
  <main class="game-grid">
    <aside class="side paper"><div class="panel-title">梁山名册 <span class="small" id="joinedCount"></span></div><div class="roster" id="roster"></div></aside>
    <section class="scene-wrap paper">
      <div class="stage-strip"><div class="stage-no" id="stageNo"></div><div><div class="stage-title" id="stageTitle"></div><div class="stage-sub" id="stageSub"></div></div></div>

      <div class="objective" id="objective"></div>
      <div class="core-scene" id="coreScene"></div>
      <div class="action-log" id="actionLog"></div>
    </section>
    <aside class="archive paper"><div class="panel-title">掌案卷宗 <span class="small" id="evidenceCount"></span></div><div class="archive-tabs"><button data-tab="evidence" class="active">证据</button><button data-tab="timeline">时间线</button><button data-tab="relations">关系网</button></div><div class="archive-list" id="archiveList"></div></aside>
  </main>
  <nav class="actionbar"><div class="ap-pill">行动点 <b id="apText"></b></div><button class="btn green" id="investigateBtn">调查取证</button><button class="btn" id="interrogateBtn">持证审讯</button><button class="btn gold" id="baitBtn">三案分投</button><button class="btn ghost" id="detainBtn">关押／释放</button><button class="btn ghost" id="observeBtn">暗中观察</button><button class="btn" id="endStageBtn">结束本夜</button></nav>
</section>
<section id="ending" class="screen hidden"><div class="ending-card paper"><div class="ending-top"><div class="seal" id="endingSeal">终</div><div class="subtitle" id="endingNo"></div><h2 id="endingTitle"></h2><p class="ending-text" id="endingText"></p></div><div class="stats" id="endingStats"></div><div class="recap"><div class="recap-section"><h3>本案真实时间线</h3><div id="caseTimeline"></div></div><div class="recap-section"><h3>人物真相与判断复盘</h3><div id="truthReveal"></div><h3 style="margin-top:18px">本局评价</h3><div id="achievementBox"></div></div></div><div class="ending-actions"><button class="btn" id="restartBtn">再查一案</button><button class="btn gold hidden" id="hiddenStageBtn">进入第8关·潜入东京</button><button class="btn ghost" id="shareBtn">复制战绩</button></div></div></section>
<section id="wolf" class="screen hidden">
  <header class="topbar">
    <div class="brand" id="wolfPhase">聚义厅</div>
    <div class="resource"><div class="resource-head"><span>你的身份</span><b id="wolfRoleText"></b></div></div>
    <button class="top-icon" id="wolfRulesBtn" title="规则">规</button><button class="top-icon" id="wolfExitBtn" title="退出">离</button>
  </header>
  <main class="wolf-main">
    <div class="wolf-scene paper" id="wolfScene">
      <div class="wolf-announce" id="wolfAnnounce"></div>
      <div class="wolf-speech" id="wolfSpeech"></div>
      <div class="wolf-note" id="wolfNote"></div>
    </div>
    <aside class="wolf-table paper"><div class="panel-title">聚义厅席位 <span class="small" id="wolfAliveCount"></span></div><div class="wolf-grid" id="wolfGrid"></div></aside>
  </main>
  <nav class="actionbar wolf-actions" id="wolfActions"></nav>
</section>
<div class="modal hidden" id="modal"><div class="modal-box paper" id="modalBox"></div></div><div class="toast" id="toast"></div>

function neutralEvidence(h,m){const st=STAGES[state.stage],loc=pick(['东侧营帐','灶房','前寨哨塔','水寨渡口']);const data={ledger:['签押记录','账簿只记录到交接时刻，无法覆盖整夜。'],follow:['跟踪片段',`暗哨看见【${h.name}】从${loc}方向返回，但中间有一段失去视线。`],search:['行囊搜查','未发现官府制式物件，但行囊曾在公共营房无人看管。'],witness:['沿途目击',`一名百姓称见过与【${h.name}】身形相似的人，无法确认面貌。`],wound:['伤势核验','伤势与正常战斗相符，既不能证明忠诚，也不能证明故意失误。'],contacts:['旧识访谈','旧识提供的经历大体吻合，但两人关系密切，证词并非完全独立。']}[m.kind];return{title:`${h.name}·${data[0]}`,text:data[1],heroId:h.id,time:m.kind==='ledger'?st.time:null,location:m.kind==='ledger'?loc:null,source:m.name,complete:'信息有限',independent:m.kind==='witness'?'独立来源':'关系待核',verifiability:'中',truth:true,direction:'neutral'}}

function wolfBeginNight(){if(wolf.over)return;wolf.phase='night';wolf.night++;wolf.day=wolf.night;wolf.killTarget=null;wolf.guarded=null;wolf.pending=null;wolf.pendingSeat=-1;wolf.speeches=[];wolf.votes={};wolf.deaths=[];wolf.saved=null;wolf.poisonTarget=null;wolf.pendingMsg='';wolf.acting='guard';wolfLog('第'+wolf.night+'夜 · '+STAGES[Math.min(wolf.night-1,6)].title+'。寨中熄灯,暗处有人行动。');wolfRender();wolfStep()}

function wolfGuardAi(g){const alive=wolfAliveList().map(s=>s.seat);const seer=wolfRoleSeat('seer'),wic=wolfRoleSeat('witch');let t=seer>=0&&seer!==g&&seer!==wolf.lastGuard?seer:(wic>=0&&wic!==g&&wic!==wolf.lastGuard?wic:(wolf.lastGuard!==g?g:alive.find(x=>x!==g&&x!==wolf.lastGuard)??g));wolf.lastGuard=t;return t}
